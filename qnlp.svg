<svg viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="360" height="96" fill="#f8fafc"/>

  <!-- qubit rails -->
  <line x1="28" y1="24" x2="332" y2="24" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="28" y1="48" x2="332" y2="48" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="28" y1="72" x2="332" y2="72" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- qubit labels -->
  <text x="14" y="28" text-anchor="middle" font-size="9" font-family="monospace" fill="#94a3b8">q₀</text>
  <text x="14" y="52" text-anchor="middle" font-size="9" font-family="monospace" fill="#94a3b8">q₁</text>
  <text x="14" y="76" text-anchor="middle" font-size="9" font-family="monospace" fill="#94a3b8">q₂</text>

  <!-- H gates, wire 0 -->
  <rect x="48" y="16" width="22" height="16" rx="2.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="59" y="27.5" text-anchor="middle" font-size="9" font-family="monospace" fill="#2563eb" font-weight="700">H</text>

  <!-- H gate, wire 1 -->
  <rect x="48" y="40" width="22" height="16" rx="2.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="59" y="51.5" text-anchor="middle" font-size="9" font-family="monospace" fill="#2563eb" font-weight="700">H</text>

  <!-- H gate, wire 2 -->
  <rect x="48" y="64" width="22" height="16" rx="2.5" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="59" y="75.5" text-anchor="middle" font-size="9" font-family="monospace" fill="#94a3b8" font-weight="600">H</text>

  <!-- Rz gate, wire 0 -->
  <rect x="148" y="16" width="26" height="16" rx="2.5" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="161" y="27.5" text-anchor="middle" font-size="9" font-family="monospace" fill="#94a3b8">Rz</text>

  <!-- Rz gate, wire 2 -->
  <rect x="148" y="64" width="26" height="16" rx="2.5" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="161" y="75.5" text-anchor="middle" font-size="9" font-family="monospace" fill="#94a3b8">Rx</text>

  <!-- CNOT: control wire0 → target wire1 at x=108 -->
  <circle cx="108" cy="24" r="4" fill="#2563eb"/>
  <line x1="108" y1="28" x2="108" y2="39" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="108" cy="48" r="9" stroke="#2563eb" stroke-width="1.5" fill="white"/>
  <line x1="99" y1="48" x2="117" y2="48" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="108" y1="39" x2="108" y2="57" stroke="#2563eb" stroke-width="1.5"/>

  <!-- CNOT: control wire1 → target wire2 at x=206 -->
  <circle cx="206" cy="48" r="4" fill="#2563eb"/>
  <line x1="206" y1="52" x2="206" y2="63" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="206" cy="72" r="9" stroke="#2563eb" stroke-width="1.5" fill="white"/>
  <line x1="197" y1="72" x2="215" y2="72" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="206" y1="63" x2="206" y2="81" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Rx gate, wire 0 -->
  <rect x="240" y="16" width="26" height="16" rx="2.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="253" y="27.5" text-anchor="middle" font-size="9" font-family="monospace" fill="#2563eb" font-weight="700">Rx</text>

  <!-- Measurement symbols -->
  <rect x="296" y="16" width="24" height="16" rx="2.5" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M300 29 Q308 20 316 29" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
  <line x1="308" y1="29" x2="312" y2="21" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="296" y="40" width="24" height="16" rx="2.5" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M300 53 Q308 44 316 53" stroke="#2563eb" stroke-width="1.2" fill="none"/>
  <line x1="308" y1="53" x2="312" y2="45" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="296" y="64" width="24" height="16" rx="2.5" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M300 77 Q308 68 316 77" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
  <line x1="308" y1="77" x2="312" y2="69" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
</svg>
