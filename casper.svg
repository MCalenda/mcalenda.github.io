<svg viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="360" height="96" fill="#f8fafc"/>

  <!-- code editor panel -->
  <rect x="16" y="12" width="180" height="72" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- line numbers -->
  <line x1="36" y1="12" x2="36" y2="84" stroke="#f1f5f9" stroke-width="1"/>
  <text x="26" y="30" text-anchor="middle" font-size="7" font-family="monospace" fill="#cbd5e1">1</text>
  <text x="26" y="42" text-anchor="middle" font-size="7" font-family="monospace" fill="#cbd5e1">2</text>
  <text x="26" y="54" text-anchor="middle" font-size="7" font-family="monospace" fill="#cbd5e1">3</text>
  <text x="26" y="66" text-anchor="middle" font-size="7" font-family="monospace" fill="#cbd5e1">4</text>
  <text x="26" y="78" text-anchor="middle" font-size="7" font-family="monospace" fill="#cbd5e1">5</text>

  <!-- code lines — normal -->
  <rect x="44" y="24" width="72" height="7" rx="1.5" fill="#e2e8f0"/>
  <rect x="44" y="36" width="100" height="7" rx="1.5" fill="#e2e8f0"/>
  <!-- smell line 3: red tint -->
  <rect x="44" y="48" width="60" height="7" rx="1.5" fill="#fee2e2"/>
  <!-- normal -->
  <rect x="44" y="60" width="88" height="7" rx="1.5" fill="#e2e8f0"/>
  <!-- smell line 5: red tint -->
  <rect x="44" y="72" width="76" height="7" rx="1.5" fill="#fee2e2"/>

  <!-- warning markers -->
  <circle cx="116" cy="51.5" r="5.5" fill="white" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="116" y1="48.5" x2="116" y2="52.5" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="116" cy="55" r="1" fill="#ef4444"/>

  <circle cx="132" cy="75.5" r="5.5" fill="white" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="132" y1="72.5" x2="132" y2="76.5" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="132" cy="79" r="1" fill="#ef4444"/>

  <!-- magnifying glass -->
  <circle cx="270" cy="44" r="28" fill="white" stroke="#2563eb" stroke-width="2"/>
  <line x1="291" y1="65" x2="312" y2="84" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

  <!-- refactored code inside lens -->
  <rect x="252" y="32" width="36" height="6" rx="1.5" fill="#dbeafe"/>
  <rect x="252" y="42" width="28" height="6" rx="1.5" fill="#dbeafe"/>
  <rect x="252" y="52" width="32" height="6" rx="1.5" fill="#dbeafe"/>

  <!-- arrow from panel to lens -->
  <line x1="196" y1="48" x2="238" y2="48" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polyline points="234,44 238,48 234,52" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
